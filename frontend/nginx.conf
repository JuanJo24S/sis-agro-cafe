server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gateway GraphQL (BFF): fuente principal de datos del front.
    location = /graphql       { proxy_pass http://gateway-graphql:8080/graphql; }

    # Acceso directo a cada microservicio (operaciones que el gateway no expone y health checks).
    location /ms/gateway/     { proxy_pass http://gateway-graphql:8080/; }
    location /ms/auth/        { proxy_pass http://ms-auth:8081/; }
    location /ms/agronomico/  { proxy_pass http://ms-agronomico:8082/; }
    location /ms/cosecha/     { proxy_pass http://ms-cosecha:8083/; }
    location /ms/financiero/  { proxy_pass http://ms-financiero:8084/; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta del cliente (/fincas, /lotes/:id...) carga index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
