# Sistema de Gestion Agronomica y Financiera para Caficultores
# RNF04 (Portabilidad): todo el sistema se levanta con un solo comando.
#
#   cp .env.example .env && docker compose up --build
#
# Puertos publicados:
#   Los puertos publicados se definen en .env para evitar conflictos con otros
#   proyectos. Dentro de la red Docker se mantienen los puertos internos.
#
# Si alguno de esos puertos ya esta ocupado en tu maquina, cambialo en .env
# (PUERTO_GATEWAY, PUERTO_AUTH, ...) sin tocar este archivo.

name: sis-agro-cafe

services:
  # ---------------------------- Infraestructura ----------------------------

  postgres:
    image: postgres:16-alpine
    container_name: agrocafe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PUERTO_POSTGRES:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [agrocafe-net]

  kafka:
    image: apache/kafka:4.1.2
    container_name: agrocafe-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNO://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNO://localhost:${PUERTO_KAFKA:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${PUERTO_KAFKA:-29092}:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [agrocafe-net]

  # Interfaz web de Kafka: topicos, mensajes (incluida la DLT) y grupos de consumo.
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: agrocafe-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: agrocafe
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${PUERTO_KAFKA_UI:-8085}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [agrocafe-net]

  # ---------------------------- Observabilidad -----------------------------

  # Metricas del broker Kafka para Prometheus: offsets por topico y lag por grupo.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: agrocafe-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [agrocafe-net]

  # Metricas: recolecta /actuator/prometheus de cada microservicio y de Kafka.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: agrocafe-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PUERTO_PROMETHEUS:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [agrocafe-net]

  # Dashboards: fuentes Prometheus y Jaeger y el tablero "AgroCafe" se aprovisionan solos.
  grafana:
    image: grafana/grafana:12.1.1
    container_name: agrocafe-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${PUERTO_GRAFANA:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [agrocafe-net]

  # Trazas distribuidas (OpenTelemetry). Todos los microservicios envian sus
  # spans por OTLP/HTTP a jaeger:4318 y la UI queda en http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    container_name: agrocafe-jaeger
    ports:
      - "${PUERTO_JAEGER:-16686}:16686"
      - "${PUERTO_OTLP_HTTP:-4318}:4318"
    networks: [agrocafe-net]

  # ---------------------------- Microservicios -----------------------------

  ms-auth:
    build:
      context: ./services/ms-auth
    image: sis-agro-cafe/ms-auth:0.0.1
    container_name: agrocafe-ms-auth
    environment:
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrocafe_auth
      JWT_EXPIRACION_SEGUNDOS: ${JWT_EXPIRACION_SEGUNDOS:-3600}
    ports:
      - "${PUERTO_AUTH:-8081}:8081"
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [agrocafe-net]

  ms-agronomico:
    build:
      context: ./services/ms-agronomico
    image: sis-agro-cafe/ms-agronomico:0.0.1
    container_name: agrocafe-ms-agronomico
    environment:
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrocafe_agronomico
    ports:
      - "${PUERTO_AGRONOMICO:-8082}:8082"
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [agrocafe-net]

  ms-cosecha:
    build:
      context: ./services/ms-cosecha
    image: sis-agro-cafe/ms-cosecha:0.0.1
    container_name: agrocafe-ms-cosecha
    environment:
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrocafe_cosecha
      AGROCAFE_URL_AGRONOMICO: http://ms-agronomico:8082
    ports:
      - "${PUERTO_COSECHA:-8083}:8083"
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ms-agronomico:
        condition: service_healthy
    networks: [agrocafe-net]

  ms-financiero:
    build:
      context: ./services/ms-financiero
    image: sis-agro-cafe/ms-financiero:0.0.1
    container_name: agrocafe-ms-financiero
    environment:
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrocafe_financiero
    ports:
      - "${PUERTO_FINANCIERO:-8084}:8084"
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [agrocafe-net]

  gateway-graphql:
    build:
      context: ./services/gateway-graphql
    image: sis-agro-cafe/gateway-graphql:0.0.1
    container_name: agrocafe-gateway
    environment:
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      AGROCAFE_URL_AUTH: http://ms-auth:8081
      AGROCAFE_URL_AGRONOMICO: http://ms-agronomico:8082
      AGROCAFE_URL_COSECHA: http://ms-cosecha:8083
      AGROCAFE_URL_FINANCIERO: http://ms-financiero:8084
    ports:
      - "${PUERTO_GATEWAY:-8080}:8080"
    depends_on:
      jaeger:
        condition: service_started
      ms-auth:
        condition: service_healthy
      ms-agronomico:
        condition: service_healthy
      ms-cosecha:
        condition: service_healthy
      ms-financiero:
        condition: service_healthy
    networks: [agrocafe-net]

  # ------------------------------- Frontend --------------------------------

  # SPA React servida por nginx, que tambien hace de proxy hacia el gateway y los
  # microservicios (no exponen CORS): http://localhost:5173
  frontend:
    build:
      context: ./frontend
    image: sis-agro-cafe/frontend:0.1.0
    container_name: agrocafe-frontend
    ports:
      - "${PUERTO_FRONTEND:-5173}:80"
    depends_on:
      gateway-graphql:
        condition: service_healthy
    networks: [agrocafe-net]

networks:
  agrocafe-net:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
