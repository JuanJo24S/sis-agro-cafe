name: sis-agro-cafe

services:

  # ---------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: agrocafe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agrocafe-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: agrocafe-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - agrocafe-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: agrocafe-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agrocafe-net

  # ---------------------------------------------------------------------
  # Microservicios de negocio
  # ---------------------------------------------------------------------

  ms-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-auth
    container_name: agrocafe-ms-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrocafe-net

  ms-agronomico:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-agronomico
    container_name: agrocafe-ms-agronomico
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=agronomico
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - agrocafe-net

  ms-cosecha:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-cosecha
    container_name: agrocafe-ms-cosecha
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=cosecha
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - agrocafe-net

  ms-financiero:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-financiero
    container_name: agrocafe-ms-financiero
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=financiero
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - agrocafe-net

  # ---------------------------------------------------------------------
  # Gateway GraphQL (BFF)
  # ---------------------------------------------------------------------

  gateway-graphql:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: gateway-graphql
    container_name: agrocafe-gateway-graphql
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MS_AUTH_URL: http://ms-auth:8080
      MS_AGRONOMICO_URL: http://ms-agronomico:8080
      MS_COSECHA_URL: http://ms-cosecha:8080
      MS_FINANCIERO_URL: http://ms-financiero:8080
    ports:
      - "8080:8080"
    depends_on:
      - ms-auth
      - ms-agronomico
      - ms-cosecha
      - ms-financiero
    networks:
      - agrocafe-net

networks:
  agrocafe-net:
    driver: bridge

volumes:
  postgres_data:
