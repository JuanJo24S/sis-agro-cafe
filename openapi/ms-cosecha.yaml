openapi: 3.0.3

info:
  title: ms-cosecha API
  version: 1.0.0
  description: |
    Servicio de **Cosecha y Trazabilidad Post-Cosecha**. Es dueño de todo lo que
    ocurre DESPUÉS de que el café se recolecta: jornadas de recolección, estado de
    procesamiento del grano (cereza → mojado → seco de agua → seco de trilla →
    almacenado) y ventas.

    Publica en Kafka el evento `IngresoRegistrado` cada vez que se registra una
    venta.

    Requisitos que cubre: RF05, RF06, RNF01, RNF02, RNF03.

    Nota: el "valor pagado a recolectores" (mano de obra de la jornada) se registra
    en la recolección pero, según la arquitectura actual, **no** dispara un evento
    de costo — solo `ms-agronomico` publica `CostoRegistrado`. Si el equipo decide
    que ese pago sí debe reflejarse en el balance financiero, hay que extender el
    modelo de eventos para que `ms-cosecha` también publique `CostoRegistrado`.

servers:
  - url: http://localhost:8083/api/v1
    description: Entorno local (Docker Compose)

tags:
  - name: Recolecciones
  - name: Ventas

security:
  - bearerAuth: []

paths:

  /lotes/{loteId}/recolecciones:
    parameters:
      - $ref: '#/components/parameters/LoteId'
    post:
      tags: [Recolecciones]
      summary: Registrar una jornada de recolección
      description: |
        Peso en cáscara y valor pagado por kg/arroba a los recolectores. El estado
        inicial del grano, si no se envía, queda en `CEREZA`.
      operationId: registrarRecoleccion
      x-requisito: RF05
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoleccionRequest' }
      responses:
        '201':
          description: Recolección registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recoleccion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    get:
      tags: [Recolecciones]
      summary: Consultar las jornadas de recolección de un lote
      operationId: listarRecolecciones
      x-requisito: RF05
      parameters:
        - name: estadoGrano
          in: query
          schema: { $ref: '#/components/schemas/EstadoGrano' }
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de recolecciones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaRecolecciones' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /recolecciones/{recoleccionId}:
    parameters:
      - name: recoleccionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Recolecciones]
      summary: Consultar una recolección
      operationId: obtenerRecoleccion
      x-requisito: RF05
      responses:
        '200':
          description: Detalle de la recolección.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recoleccion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Recolecciones]
      summary: Anular una recolección registrada por error
      description: |
        DECISIÓN PENDIENTE con el equipo (mismo criterio que `DELETE /labores/{id}`
        en ms-agronomico). Hoy la recolección no publica ningún evento financiero
        (ver nota en la descripción del servicio), así que anularla no requiere
        compensar ms-financiero — pero si el equipo decide empezar a publicar
        `CostoRegistrado` por el pago a recolectores, este DELETE deberá publicar
        también su evento compensatorio.
      operationId: anularRecoleccion
      x-estado: decision-pendiente
      responses:
        '204':
          description: Recolección anulada.
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /recolecciones/{recoleccionId}/estado:
    parameters:
      - name: recoleccionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Recolecciones]
      summary: Actualizar el estado de procesamiento del grano
      description: |
        Transición de negocio (cereza → mojado → seco de agua → seco de trilla →
        almacenado). Se modela como sub-recurso, igual que
        `POST /fertilizaciones/{id}/ejecucion` en ms-agronomico, y no como
        `PUT /recolecciones/{id}`, porque no es una edición libre de campos.
      operationId: actualizarEstadoRecoleccion
      x-requisito: RF05
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstadoGranoRequest' }
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recoleccion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Transición de estado no permitida (ej. de ALMACENADO a CEREZA).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /ventas:
    post:
      tags: [Ventas]
      summary: Registrar una venta o almacenamiento de café procesado
      description: |
        Precio por arroba/carga y comprador. Al persistirse, el servicio publica el
        evento Kafka `IngresoRegistrado`.
      operationId: registrarVenta
      x-requisito: RF06
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VentaRequest' }
      responses:
        '201':
          description: Venta registrada. El evento de ingreso se publica de forma asíncrona.
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venta' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    get:
      tags: [Ventas]
      summary: Listar ventas
      operationId: listarVentas
      x-requisito: RF06
      parameters:
        - name: loteId
          in: query
          description: Filtrar ventas por lote de origen.
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de ventas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaVentas' }

  /ventas/{ventaId}:
    parameters:
      - name: ventaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Ventas]
      summary: Consultar una venta
      operationId: obtenerVenta
      x-requisito: RF06
      responses:
        '200':
          description: Detalle de la venta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venta' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Ventas]
      summary: Anular una venta registrada por error
      description: |
        DECISIÓN PENDIENTE con el equipo, mismo criterio que `DELETE /labores/{id}`
        en ms-agronomico: si se permite anular una venta, el balance de
        ms-financiero queda desactualizado, así que la anulación DEBE publicar un
        evento compensatorio `IngresoAnulado`. Si el equipo prefiere no manejar
        eventos compensatorios en el MVP, este endpoint se elimina y las ventas se
        vuelven inmutables.
      operationId: anularVenta
      x-estado: decision-pendiente
      responses:
        '204':
          description: Venta anulada; se publicó `IngresoAnulado`.
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LoteId:
      name: loteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Número de página (base 0).
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Tamaño de página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        RECOMENDACIÓN. Evita registrar dos veces la misma recolección o venta si el
        cliente reintenta la petición (y, por lo tanto, evita duplicar el balance
        financiero).
      schema: { type: string, format: uuid }

  schemas:

    EstadoGrano:
      type: string
      enum: [CEREZA, MOJADO, SECO_AGUA, SECO_TRILLA, ALMACENADO]

    RecoleccionRequest:
      type: object
      required: [fecha, pesoCascaraKg, valorPorKgArroba]
      properties:
        fecha: { type: string, format: date }
        pesoCascaraKg: { type: number, format: double, minimum: 0, example: 320 }
        valorPorKgArroba:
          type: number
          format: double
          minimum: 0
          description: Valor pagado por kg/arroba a los recolectores.
          example: 2500
        recolector: { type: string, example: Pedro Gómez }
        estadoGrano:
          allOf:
            - $ref: '#/components/schemas/EstadoGrano'
          default: CEREZA

    Recoleccion:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            loteId: { type: string, format: uuid }
        - $ref: '#/components/schemas/RecoleccionRequest'
        - type: object
          properties:
            costoManoObra:
              type: number
              format: double
              description: Campo calculado = pesoCascaraKg * valorPorKgArroba.
            fechaRegistro: { type: string, format: date-time }

    EstadoGranoRequest:
      type: object
      required: [estadoGrano]
      properties:
        estadoGrano: { $ref: '#/components/schemas/EstadoGrano' }

    VentaRequest:
      type: object
      required: [loteId, fecha, cantidad, precioPorArroba, comprador]
      properties:
        loteId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        cantidad:
          type: number
          format: double
          minimum: 0
          description: Arrobas o carga vendida.
          example: 12.5
        precioPorArroba: { type: number, format: double, minimum: 0, example: 950000 }
        comprador: { type: string, example: Cooperativa Cafeteros del Huila }

    Venta:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
        - $ref: '#/components/schemas/VentaRequest'
        - type: object
          properties:
            montoTotal:
              type: number
              format: double
              description: Campo calculado = cantidad * precioPorArroba. Es el valor publicado en `IngresoRegistrado`.
            fechaRegistro: { type: string, format: date-time }

    Pagina:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    PaginaRecolecciones:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Recoleccion' }

    PaginaVentas:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Venta' }

    Problema:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }

  responses:
    SolicitudInvalida:
      description: Datos de entrada inválidos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El recurso solicitado no existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
