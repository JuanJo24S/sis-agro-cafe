server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-financiero
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrocafe_financiero}
    username: ${SPRING_DATASOURCE_USERNAME:agrocafe}
    password: ${SPRING_DATASOURCE_PASSWORD:agrocafe}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:6}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Propaga el traceId en las cabeceras de los mensajes para ver el flujo completo en Jaeger.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: ${AGROCAFE_GRUPO_CONSUMIDOR:ms-financiero}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sisagrodev.financiero.evento.MovimientoFinancieroEvent
        spring.json.trusted.packages: com.sisagrodev.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

agrocafe:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-por-uno-largo-y-aleatorio}
  kafka:
    topico-costos: ${AGROCAFE_TOPICO_COSTOS:costo-registrado}
    topico-costos-anulados: ${AGROCAFE_TOPICO_COSTOS_ANULADOS:costo-anulado}
    topico-ingresos: ${AGROCAFE_TOPICO_INGRESOS:ingreso-registrado}
    topico-ingresos-anulados: ${AGROCAFE_TOPICO_INGRESOS_ANULADOS:ingreso-anulado}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    filter: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  # Metricas para Prometheus (/actuator/prometheus), etiquetadas con el nombre del servicio.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Trazas distribuidas: cada peticion se exporta por OTLP a Jaeger (http://localhost:16686).
  tracing:
    sampling:
      probability: ${TRACING_PROBABILIDAD:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.sisagrodev: INFO
