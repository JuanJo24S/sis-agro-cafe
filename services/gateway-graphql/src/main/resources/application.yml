server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-graphql
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true
    path: /graphql

agrocafe:
  clientes:
    timeout:
      conexion: ${TIMEOUT_CONEXION:3s}
      lectura: ${TIMEOUT_LECTURA:10s}
    auth:
      url: ${AGROCAFE_URL_AUTH:http://localhost:8081}
    agronomico:
      url: ${AGROCAFE_URL_AGRONOMICO:http://localhost:8082}
    cosecha:
      url: ${AGROCAFE_URL_COSECHA:http://localhost:8083}
    financiero:
      url: ${AGROCAFE_URL_FINANCIERO:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  # Metricas para Prometheus (/actuator/prometheus), etiquetadas con el nombre del servicio.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Trazas distribuidas: cada peticion se exporta por OTLP a Jaeger (http://localhost:16686).
  tracing:
    sampling:
      probability: ${TRACING_PROBABILIDAD:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.sisagrodev: INFO
