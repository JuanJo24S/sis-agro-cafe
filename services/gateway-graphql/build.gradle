plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sisagrodev'
version = '0.0.1-SNAPSHOT'
description = 'gateway-graphql - BFF de agregacion (RNF03)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Permite que el Dockerfile descargue las dependencias en una capa aparte: mientras
// build.gradle no cambie, reconstruir la imagen no vuelve a bajar nada de la red.
tasks.register('descargarDependencias') {
	doLast {
		configurations.matching { it.canBeResolved }.each { configuracion ->
			try {
				configuracion.incoming.artifactView { lenient = true }.files.files
			}
			catch (Exception ignorado) {
				logger.lifecycle("No se pudo resolver ${configuracion.name}, se omite.")
			}
		}
	}
}
