server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrocafe_auth}
    username: ${SPRING_DATASOURCE_USERNAME:agrocafe}
    password: ${SPRING_DATASOURCE_PASSWORD:agrocafe}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:6}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

agrocafe:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-por-uno-largo-y-aleatorio}
    expiracion-segundos: ${JWT_EXPIRACION_SEGUNDOS:3600}
    emisor: sis-agro-cafe

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    filter: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  # Metricas para Prometheus (/actuator/prometheus), etiquetadas con el nombre del servicio.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Trazas distribuidas: cada peticion se exporta por OTLP a Jaeger (http://localhost:16686).
  tracing:
    sampling:
      probability: ${TRACING_PROBABILIDAD:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.sisagrodev: INFO
