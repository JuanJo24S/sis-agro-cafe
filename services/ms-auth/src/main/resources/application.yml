server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrocafe_auth}
    username: ${SPRING_DATASOURCE_USERNAME:agrocafe}
    password: ${SPRING_DATASOURCE_PASSWORD:agrocafe}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

agrocafe:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-por-uno-largo-y-aleatorio}
    expiracion-segundos: ${JWT_EXPIRACION_SEGUNDOS:3600}
    emisor: sis-agro-cafe

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    com.sisagrodev: INFO
