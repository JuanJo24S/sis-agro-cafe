server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-agronomico
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrocafe_agronomico}
    username: ${SPRING_DATASOURCE_USERNAME:agrocafe}
    password: ${SPRING_DATASOURCE_PASSWORD:agrocafe}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 5
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

agrocafe:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-por-uno-largo-y-aleatorio}
  kafka:
    topico-costos: ${AGROCAFE_TOPICO_COSTOS:costo-registrado}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    com.sisagrodev: INFO
